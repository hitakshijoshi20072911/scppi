services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vendorproof
      POSTGRES_USER: vendorproof
      POSTGRES_PASSWORD: vendorproof
    ports:
      - '5432:5432'
    volumes:
      - vendorproof-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendorproof -d vendorproof']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendorproof-postgres:
