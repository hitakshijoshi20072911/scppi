name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit

      - name: Check Swytchcode tooling changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '.swytchcode/tooling.json'; then
            if git diff --name-only HEAD~1 HEAD | grep -q 'docs/api-inventory.md'; then
              echo "Swytchcode tooling changed with api-inventory update - OK"
            else
              echo "ERROR: Swytchcode tooling changed without api-inventory update"
              exit 1
            fi
          fi
